<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="../utils/styles.css" rel="stylesheet">
    <title>测试界面</title>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>❤️ 心率监测器</h1>
            <p>连接您的蓝牙心率设备，实时监测您的心率数据</p>
        </div>
        
        <div class="version-info">
            当前node版本 <span id="node-version">v16.0.0</span>,
            Chromium <span id="chrome-version">v96.0.0</span>,
            Electron <span id="electron-version">v16.0.0</span>.
        </div>

        <button class="start-button">开始搜索蓝牙设备</button>

        <div id="app2">
            <div class="heartView">
                <div class="heart-label">当前心率</div>
                <div id="heart" class="heart">72</div>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <div class="status-text">设备已连接</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
