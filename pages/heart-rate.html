<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>心率监测</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, sans-serif;
            overflow: hidden;
            cursor: move;
            user-select: none;
        }
        
        .heart-container {
            width: 200px;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: transparent;
            color: white;
        }
        
        .heart-rate {
            font-size: 64px;
            font-weight: bold;
            color: #ff6b6b;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.8),
                         0 0 20px rgba(255, 107, 107, 0.6),
                         0 0 30px rgba(255, 107, 107, 0.4);
        }
        
        .close-confirm {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ff6b6b;
            display: none;
            z-index: 100;
        }
        
        .close-confirm p {
            margin: 0 0 15px 0;
            color: white;
            font-size: 14px;
        }
        
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 5px;
        }
        .close-btn{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .skin-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #666;
            min-width: 120px;
            z-index: 1000;
        }
        
        .skin-option {
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            margin: 2px 0;
            transition: background-color 0.2s;
        }
        
        .skin-option:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        /* 动画效果 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 15px currentColor, 0 0 25px currentColor, 0 0 35px currentColor; }
            50% { text-shadow: 0 0 20px currentColor, 0 0 30px currentColor, 0 0 40px currentColor; }
        }
        
        @keyframes bounce {
            0%, 20%, 53%, 80%, 100% { transform: translate3d(0,0,0); }
            40%, 43% { transform: translate3d(0, -8px, 0); }
            70% { transform: translate3d(0, -4px, 0); }
            90% { transform: translate3d(0, -2px, 0); }
        }
        
        @keyframes fade {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="heart-container" id="heartContainer">
        <div class="heart-rate" id="heartRate">0</div>
        <div class="skin-menu" id="skinMenu" style="display: none;">
            <div class="skin-option" data-skin="default">默认皮肤</div>
            <div class="skin-option" data-skin="blue-tech">蓝色科技</div>
            <div class="skin-option" data-skin="pink-cute">粉色可爱</div>
            <div class="skin-option" data-skin="green-nature">绿色自然</div>
        </div>
    </div>
    
    <div class="close-confirm" id="closeConfirm">
        <p>确定要关闭心率监测吗？</p>
        <div class="close-btn">
            <button onclick="confirmClose()">确定</button>
            <button onclick="cancelClose()">取消</button>
        </div>
    </div>

    <script>
        // 拖动窗口功能
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };

        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragOffset.x = e.clientX;
            dragOffset.y = e.clientY;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const { screenX, screenY } = e;
                if (window.electronHeartRate && window.electronHeartRate.sendMoveWindow) {
                    window.electronHeartRate.sendMoveWindow({
                        x: screenX - dragOffset.x,
                        y: screenY - dragOffset.y
                    });
                }
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // 双击关闭功能
        let lastClickTime = 0;
        document.addEventListener('dblclick', (e) => {
            e.preventDefault();
            e.stopPropagation();
            showCloseConfirm();
        });
        
        // 右键显示关闭确认
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            showCloseConfirm();
        });
        
        // 显示关闭确认弹窗
        function showCloseConfirm() {
            const confirm = document.getElementById('closeConfirm');
            confirm.style.display = 'block';
        }
        
        // 确认关闭
        function confirmClose() {
            if (window.electronHeartRate && window.electronHeartRate.sendCloseWindow) {
                window.electronHeartRate.sendCloseWindow();
            }
            hideCloseConfirm();
        }
        
        // 取消关闭
        function cancelClose() {
            hideCloseConfirm();
        }
        
        // 隐藏关闭确认
        function hideCloseConfirm() {
            const confirm = document.getElementById('closeConfirm');
            confirm.style.display = 'none';
        }

        // 监听心率数据更新
        if (window.electronHeartRate && window.electronHeartRate.onUpdateHeartRate) {
            console.log('开始监听心率数据更新');
            window.electronHeartRate.onUpdateHeartRate((heartRate) => {
                console.log('收到心率数据:', heartRate);
                document.getElementById('heartRate').textContent = heartRate;
            });
        } else {
            console.log('无法监听心率数据更新: API不可用');
        }

        // 皮肤功能
        let currentSkin = null;
        
        // 初始化皮肤
        async function initSkin() {
            try {
                if (window.electronHeartRate && window.electronHeartRate.getSkinConfig) {
                    currentSkin = await window.electronHeartRate.getSkinConfig();
                    applySkin(currentSkin);
                    
                    // 监听皮肤变化
                    window.electronHeartRate.onSkinChanged((newSkin) => {
                        currentSkin = newSkin;
                        applySkin(newSkin);
                    });
                }
            } catch (error) {
                console.error('初始化皮肤失败:', error);
            }
        }
        
        // 应用皮肤
        function applySkin(skin) {
            const heartRateElement = document.getElementById('heartRate');
            const containerElement = document.getElementById('heartContainer');
            
            // 应用字体样式
            heartRateElement.style.fontFamily = skin.fontFamily;
            heartRateElement.style.color = skin.fontColor;
            heartRateElement.style.fontSize = skin.fontSize + 'px';
            heartRateElement.style.textShadow = skin.textShadow;
            
            // 应用背景
            if (skin.backgroundImage) {
                containerElement.style.backgroundImage = `url(${skin.backgroundImage})`;
                containerElement.style.backgroundSize = 'cover';
                containerElement.style.backgroundPosition = 'center';
            } else {
                containerElement.style.background = skin.backgroundColor;
                containerElement.style.backgroundImage = 'none';
            }
            
            // 应用动画
            heartRateElement.style.animation = 'none';
            setTimeout(() => {
                heartRateElement.style.animation = `${skin.animation} 2s infinite`;
            }, 10);
        }
        
        // 切换皮肤菜单
        function toggleSkinMenu() {
            const skinMenu = document.getElementById('skinMenu');
            skinMenu.style.display = skinMenu.style.display === 'none' ? 'block' : 'none';
        }
        
        // 切换皮肤
        async function changeSkin(skinId) {
            try {
                if (window.electronHeartRate && window.electronHeartRate.changeSkin) {
                    const result = await window.electronHeartRate.changeSkin(skinId);
                    if (result.success) {
                        document.getElementById('skinMenu').style.display = 'none';
                    } else {
                        console.error('切换皮肤失败:', result.error);
                    }
                }
            } catch (error) {
                console.error('切换皮肤错误:', error);
            }
        }
        
        // 添加中键点击事件（换肤）
        document.addEventListener('mousedown', (e) => {
            if (e.button === 1) { // 中键
                e.preventDefault();
                e.stopPropagation();
                toggleSkinMenu();
            }
        });
        
        // 皮肤选项点击事件
        document.querySelectorAll('.skin-option').forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                changeSkin(option.dataset.skin);
            });
        });
        
        // 点击其他地方关闭皮肤菜单
        document.addEventListener('mousedown', (e) => {
            const skinMenu = document.getElementById('skinMenu');
            if (skinMenu.style.display !== 'none' && !skinMenu.contains(e.target)) {
                skinMenu.style.display = 'none';
            }
        });
        
        // 初始化皮肤
        initSkin();
    </script>
</body>
</html>
